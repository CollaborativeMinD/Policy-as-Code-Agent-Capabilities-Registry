name: Qualify capability policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b
        with:
          python-version: '3.13'
      - name: Install hash-locked dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip check
      - name: Qualify policy, lifecycle and MCP stdio
        run: python -B -W error -m unittest -v
