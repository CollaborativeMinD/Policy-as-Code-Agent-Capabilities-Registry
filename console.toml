version = 1
component = "Agent Capabilities Registry"
host = "127.0.0.1"
port = 8772
protocol = "2026-07-28"
poll_seconds = 3

[roles]
viewer = ["inventory.read"]
admin = ["inventory.read", "policy.open", "policy.apply"]
agent = ["inventory.read", "task.execute"]

[resources.report-preview]
operation = "reports.preview"
editable_inputs = ["text"]
source = ".local/registry-upstream.toml"
[resources.report-preview.inputs]
text = "Review the report"
